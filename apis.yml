name: Zelis
description: >-
  Zelis is a healthcare financial technology company that modernizes the
  business of healthcare by connecting payers, providers, and members through a
  connected platform for claims cost management, electronic payments, and member
  and provider communications. Its solutions span network analytics and
  optimization, claims pricing, editing and payment integrity, electronic
  provider payments (including the ZAPP platform), member engagement, price
  transparency and Transparency in Coverage compliance, and provider directory
  data. Zelis exposes these capabilities to partners through a public developer
  portal and API marketplace, where integrators can register for OAuth2
  client-credential access to a catalog of claims, ID card, provider directory,
  enrollment, payments, and member-engagement communication APIs. The company
  serves 725+ payers and processes payments to hundreds of thousands of
  healthcare providers.
