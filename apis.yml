apis:
- name: Zelis API
  description: >-
    Zelis' partner-facing API platform, published through the Zelis developer
    portal and API marketplace. The catalog spans claims document search and
    viewing, member ID card search and viewing, provider directory, enrollment
    communications, payments communications, and member activation/reward
    surfaces. Access is gated behind OAuth2 client-credential tokens plus an
    Azure API Management subscription key (Ocp-Apim-Subscription-Key).
